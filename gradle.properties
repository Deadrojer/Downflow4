# Gradle JVM settings
# Termux: build_termux.sh sets JAVA_TOOL_OPTIONS to a device-appropriate heap
#         value, which the JVM reads before this property, effectively
#         overriding it. The value here applies on PC / CI builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled by build_termux.sh on device builds to save
# disk space; keep it enabled for PC/CI builds.
org.gradle.configuration-cache=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# Suppress the "this sdk is not compatible" lint check — the SDK installed
# by sdkmanager in Termux may have a slightly mismatched build-tools version.
android.suppressUnsupportedCompileSdk=35

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Termux: disable daemon by default on low-RAM devices (overridden by build script)
# Remove or set to true for faster incremental builds on high-RAM devices.
org.gradle.daemon=false
